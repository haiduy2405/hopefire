<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache">
<title>HOPEFIRE</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%94%A5%3C/text%3E%3C/svg%3E">
<script>
// ===== VERSION =====
// Bump this together with version.json on every release (tools/bump.ps1 does both).
window.HF_VERSION='0.9.9';
document.title='HOPEFIRE v'+window.HF_VERSION;
// Every asset URL carries ?v=<version>, so a new version never loads stale cached files.
document.write('<link rel="stylesheet" href="css/style.css?v='+window.HF_VERSION+'">');
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="hope">🔥<div id="hopewrap"><div id="hopebar"></div><div id="hopetxt"></div></div></div>
  <span class="stat" id="scrapT">⚙ 0</span>
  <span class="stat" id="coreT">✦ 0</span>
  <span class="stat" id="threatT">THREAT 1</span>
  <span class="stat" id="siteT"></span>
  <span class="stat ver" id="verT"></span>
</div>
<div id="tip"></div>
<div id="bottom">
  <div id="row1"></div>
  <div id="spellBar"></div>
  <div id="row2">
    <button class="btn" id="quitBtn" title="Abandon run">✕</button>
    <button class="btn hide" id="reactBtn">⚛ NORMAL</button>
    <button class="btn" id="packBtn">OPEN CRATE</button>
    <button class="btn" id="spdBtn">1x</button>
    <button class="btn" id="loadBtn" title="Loadout (Tab)">☰</button>
    <button class="btn" id="pauseBtn" title="Pause (Esc / P)">II</button>
    <button class="btn" id="muteBtn">🔊</button>
  </div>
</div>
<div id="modal"></div>
<div id="upd" class="hidden"></div>
<button id="updBtn" class="hidden"></button>
<div id="flash"></div>
<div id="toasts"></div>
<button id="skipCut">SKIP ▸▸</button>
<script>
document.write('<script src="assets/sprites.js?v='+window.HF_VERSION+'"><\/script>');
document.write('<script src="assets/vo/manifest.js?v='+window.HF_VERSION+'"><\/script><script src="assets/music/manifest.js?v='+window.HF_VERSION+'"><\/script>');
['data','core','audio','music','voice','render','sprites','game','react','crew','horde','spells','relics','progress','cutscene','update','crate','ui','pad','title','main'].forEach(function(n){
  document.write('<script src="src/'+n+'.js?v='+window.HF_VERSION+'"><\/script>');
});
</script>
</body>
</html>
